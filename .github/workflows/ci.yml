name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest

  postgres:
    # The game runs on SQLite by default; this proves the same models and queries also
    # work against the Postgres schema the project targets in production.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lineups
          POSTGRES_PASSWORD: lineups
          POSTGRES_DB: lineups_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt

      - name: Run tests against Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://lineups:lineups@localhost:5432/lineups_db
        run: pytest tests/test_api.py

  worker:
    # The leaderboard recalculates every score it is sent, so it has to agree with the
    # game to the point. These tests run the worker for real against a local database.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Scoring and token tests
        run: npm test

      - name: End-to-end tests against a real worker
        run: node --test 'test/service.test.js'
        env:
          CI: "1"
