# Publishes the installable games to GitHub Pages: Line-Ups at the root, and
# Quick Fire - the ten minute team quiz - at /quiz/.
#
# Before the first run, set Settings -> Pages -> Source to "GitHub Actions".
# Note: on the free plan, Pages only serves public repositories.
name: Publish the games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python scripts/build_standalone.py --site

      # Into a subfolder of the same upload, so one deploy serves both games and
      # they can share the one leaderboard worker.
      - name: Build the quiz
        run: python scripts/build_quiz.py --site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
