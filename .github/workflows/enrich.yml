# Looks player facts up on Wikidata.
#
# This runs here rather than on a developer machine because the development sandbox
# has no route to Wikidata, while a CI runner does. It is manual (workflow_dispatch)
# so a lookup only happens when someone asks for one.
#
#   mode: probe  - a handful of known players, printed for eyeballing. Costs nothing
#                  and proves the lookup still works.
#   mode: all    - every player in data/lineups.json.
#
# A full sweep pushes its result to the data/player-facts branch rather than to main.
# These facts end up in a game, so they get read before they land: the branch can be
# fetched and inspected, and merged only once it looks right.
name: Look up player facts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (a few players) or all (the whole archive)"
        type: choice
        options: [probe, all]
        default: probe

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe a few players
        if: inputs.mode == 'probe'
        run: python scripts/fetch_player_facts.py --probe

      - name: Look up the whole archive
        if: inputs.mode == 'all'
        run: python scripts/fetch_player_facts.py --all --out data/player_facts.json

      - name: Upload the results for review
        if: inputs.mode == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: player-facts
          path: data/player_facts.json

      - name: Push the results to a branch for review
        if: inputs.mode == 'all'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B data/player-facts
          git add -f data/player_facts.json
          git commit -m "Player facts from Wikidata, $(date -u +%Y-%m-%d)" || {
            echo "nothing changed since the last sweep"; exit 0; }
          git push -f origin data/player-facts
